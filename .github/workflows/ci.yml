name: CI

# Quality gates. Real-GPU tests do not run on CI runners (ADR 0005: an environment without an
# adapter skips them explicitly; a release needs a green real-GPU run). Here the GPU cases are
# skipped with KARUME_ALLOW_NO_GPU=1 so that the non-GPU tests catch regressions. Publishing
# dry-runs return once the 0.15.0 registry decision (JSR / npm) is made.
#
# The Python side is split in two jobs along the ADR 0065 boundary (core / recipes): the
# `exporter-core` that ships to PyPI and the repository-only `export-recipes`.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          # Same major as the local toolchain (vp-managed pnpm); the lockfile format is v9.
          version: 12
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        # Build scripts stay declined (pnpm-workspace.yaml allowBuilds); the lockfile must be current.
        run: pnpm install --frozen-lockfile
      - name: Format + lint + type-check
        # `vp check` runs the Oxfmt check, Oxlint (type-aware) and the TypeScript 7 type check.
        run: pnpm exec vp check
      - name: Test (core lane, non-GPU)
        # GPU cases are skipped (no adapter) and the all-skip gates are opened explicitly. The real
        # weight assets (outputs/series/) and distribution mirrors (models/) are not on CI either,
        # so the asset and distribution gates are opened too. Family lanes need those assets and
        # run locally before a release.
        env:
          KARUME_ALLOW_NO_GPU: "1"
          KARUME_ALLOW_NO_ASSETS: "1"
          KARUME_ALLOW_NO_DISTRIBUTION: "1"
        run: pnpm exec vp test --project core

  exporter-core:
    # PyPI `karume`（汎用 exporter core）の門番。torch は pytorch-cpu index の CPU wheel なので
    # GPU も CUDA ランナーも要らない。ADR 0065 決定 3/7 の「core wheel に family コードを
    # 入れない」は規約ではなく検査で守る — 段 5+6 でローカル実測した wheel/sdist の内容検査を
    # ここで常設化する。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/exporter
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          # ローカル開発機と同一にピン（lock の解決も build の出力構成もバージョンで変わり得る）。
          version: "0.11.21"
          # ローカル venv と同じ 3.14。requires-python は >=3.12 だが、この job の役割は
          # バージョン matrix ではなく「ローカル verify と同じものが CI でも緑」の確認。
          python-version: "3.14"
          enable-cache: true
      - name: Test (core)
        # `--locked` は uv.lock の陳腐化も同時に検出する（CI 側での暗黙の再ロックを許さない）。
        # golden io のバイト突合（30 件）は参照環境専用のため CI では SKIP される
        # （torch CPU の最終 bit はマシン依存 — docs/limitations.md の参照環境節）。
        run: uv run --locked pytest
      - name: Build
        # uv workspace のメンバーなので、既定の出力先は workspace ルート（tools/dist）になる。
        # 次の step が読む場所を固定するため out-dir を明示する。
        run: uv build --out-dir dist
      - name: Inspect distribution
        # core wheel の境界検査。①karume/ と .dist-info/ 以外が入っていない ②family の
        # `patch_*` と repo topology の `paths.py` が wheel にも sdist にも無い
        # ③LICENSE 同梱 ④METADATA の SPDX が MIT。落ちたら違反エントリを標準出力に出す。
        run: |
          whl=$(echo dist/karume-*.whl)
          names=$(unzip -Z1 "$whl")
          if printf '%s\n' "$names" | grep -Ev '^(karume/|karume-[^/]+\.dist-info/)'; then
            echo "::error::wheel に karume/ 以外の配布物が入っている（上が違反エントリ）"; exit 1
          fi
          if printf '%s\n' "$names" | grep -E '(^|/)(patch_[^/]*|paths)\.py$'; then
            echo "::error::wheel に family コード / repo topology が入っている"; exit 1
          fi
          printf '%s\n' "$names" | grep -q '\.dist-info/licenses/LICENSE$' ||
            { echo "::error::wheel に .dist-info/licenses/LICENSE が無い"; exit 1; }
          unzip -p "$whl" '*.dist-info/METADATA' | grep -qx 'License-Expression: MIT' ||
            { echo "::error::METADATA の License-Expression が MIT でない"; exit 1; }
          if tar tzf dist/karume-*.tar.gz | grep -E '(^|/)(patch_[^/]*|paths)\.py$'; then
            echo "::error::sdist に family コード / repo topology が入っている"; exit 1
          fi
      - name: Lint
        run: uv run --locked ruff check
      - name: Format
        run: uv run --locked ruff format --check

  export-recipes:
    # モデル別 recipe（wheel 外・リポ専用）の門番。回すのは fixture ベースのテストだけで、
    # family 依存グループ（diffusers / transformers / style-bert-vits2 …）とローカル資産
    # （inputs/ / outputs/series/ — いずれも git 追跡外）を要するケースは既存の importorskip /
    # skipif が SKIP する。既定 sync のまま `--all-groups` を付けないのは、追加で入るのが
    # 「入れても SKIP が減るだけで、資産が無い CI では結局回らない」重い依存だから。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/export-recipes
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.21"
          python-version: "3.14"
          enable-cache: true
      - name: Test (recipes)
        run: uv run --locked pytest
      - name: Lint
        run: uv run --locked ruff check
      - name: Format
        run: uv run --locked ruff format --check
      # tools/llm-baseline（workspace 外の単発台本）は自前の ruff 設定を持たないので、recipe と同じ設定で縛る。
      # --config を明示するのは、祖先に設定が無いファイルへの ruff の設定探索に頼らないため。
      # llm-baseline の pytest は載せない: テストが transformers / accelerate を importorskip 無しで
      # 読み、既定 sync では入らない（手元で回す手順は tools/llm-baseline/README.md）。
      - name: Lint (workspace-external scripts)
        run: uv run --locked ruff check --config pyproject.toml ../llm-baseline
      - name: Format (workspace-external scripts)
        run: uv run --locked ruff format --check --config pyproject.toml ../llm-baseline
