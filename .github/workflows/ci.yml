name: CI

# Quality gates. Real-GPU tests do not run on CI runners (ADR 0005: an environment without an
# adapter skips them explicitly; a release needs a green real-GPU run). Here the GPU cases are
# skipped with KARUME_ALLOW_NO_GPU=1 so that the non-GPU tests catch regressions. Publishing
# dry-runs return once the 0.15.0 registry decision (JSR / npm) is made.
#
# The Python side is split in two jobs along the ADR 0065 boundary (core / recipes): the
# `exporter-core` that ships to PyPI and the repository-only `export-recipes`.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          # Same major as the local toolchain (vp-managed pnpm); the lockfile format is v9.
          version: 12
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        # Build scripts stay declined (pnpm-workspace.yaml allowBuilds); the lockfile must be current.
        run: pnpm install --frozen-lockfile
      - name: Format + lint + type-check
        # `vp check` runs the Oxfmt check, Oxlint (type-aware) and the TypeScript 7 type check.
        run: pnpm exec vp check
      - name: Test (core lane, non-GPU)
        # GPU cases are skipped (no adapter) and the all-skip gates are opened explicitly. The real
        # weight assets (outputs/series/) and distribution mirrors (models/) are not on CI either,
        # so the asset and distribution gates are opened too. Family lanes need those assets and
        # run locally before a release.
        env:
          KARUME_ALLOW_NO_GPU: "1"
          KARUME_ALLOW_NO_ASSETS: "1"
          KARUME_ALLOW_NO_DISTRIBUTION: "1"
        run: pnpm exec vp test --project core

  exporter-core:
    # Check for PyPI `karume` (the generic exporter core). torch comes as a CPU wheel from the pytorch-cpu
    # index, so neither a GPU nor a CUDA runner is needed. "No family code in the core wheel" (ADR 0065
    # decisions 3 and 7) is enforced by inspection, not by convention — the wheel/sdist content check that
    # was run locally at steps 5+6 is made permanent here.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/exporter
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          # Pinned to the same version as the local dev machine (lock resolution and build output can change with the version).
          version: "0.11.21"
          # 3.14, same as the local venv. requires-python is >=3.12, but this job's role is not a version
          # matrix — it confirms that what passes the local verify is also green in CI.
          python-version: "3.14"
          enable-cache: true
      - name: Test (core)
        # `--locked` also detects a stale uv.lock (no implicit re-lock on the CI side).
        # The byte comparison of the golden io (30 cases) is for the reference environment only and is
        # SKIPped in CI (the last bit of torch CPU is machine dependent — the reference-environment section of docs/limitations.md).
        run: uv run --locked pytest
      - name: Build
        # As a member of the uv workspace, the default output directory is the workspace root (tools/dist).
        # out-dir is explicit so that the next step reads a fixed location.
        run: uv build --out-dir dist
      - name: Inspect distribution
        # Boundary check of the core wheel. (1) nothing besides karume/ and .dist-info/ is included; (2) the
        # families' `patch_*` and the repo-topology `paths.py` are in neither the wheel nor the sdist;
        # (3) LICENSE is bundled; (4) the SPDX in METADATA is MIT. On failure the offending entries go to stdout.
        run: |
          whl=$(echo dist/karume-*.whl)
          names=$(unzip -Z1 "$whl")
          if printf '%s\n' "$names" | grep -Ev '^(karume/|karume-[^/]+\.dist-info/)'; then
            echo "::error::the wheel contains files outside karume/ (offending entries above)"; exit 1
          fi
          if printf '%s\n' "$names" | grep -E '(^|/)(patch_[^/]*|paths)\.py$'; then
            echo "::error::the wheel contains family code / repo topology"; exit 1
          fi
          printf '%s\n' "$names" | grep -q '\.dist-info/licenses/LICENSE$' ||
            { echo "::error::the wheel lacks .dist-info/licenses/LICENSE"; exit 1; }
          unzip -p "$whl" '*.dist-info/METADATA' | grep -qx 'License-Expression: MIT' ||
            { echo "::error::License-Expression in METADATA is not MIT"; exit 1; }
          if tar tzf dist/karume-*.tar.gz | grep -E '(^|/)(patch_[^/]*|paths)\.py$'; then
            echo "::error::the sdist contains family code / repo topology"; exit 1
          fi
      - name: Lint
        run: uv run --locked ruff check
      - name: Format
        run: uv run --locked ruff format --check

  export-recipes:
    # Check for the per-model recipes (outside the wheel, repository-only). Only the fixture-based tests run;
    # cases that need a family dependency group (diffusers / transformers / style-bert-vits2 …) or local
    # assets (inputs/ / outputs/series/ — both untracked) are SKIPped by the existing importorskip /
    # skipif. The default sync is kept without `--all-groups` because what it would add are heavy
    # dependencies that only reduce SKIPs and still cannot run in a CI without the assets.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/export-recipes
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.21"
          python-version: "3.14"
          enable-cache: true
      - name: Test (recipes)
        run: uv run --locked pytest
      - name: Lint
        run: uv run --locked ruff check
      - name: Format
        run: uv run --locked ruff format --check
      # tools/llm-baseline (one-off scripts outside the workspace) has no ruff configuration of its own, so it is bound to the recipes' settings.
      # --config is explicit so as not to rely on ruff's configuration discovery for files with no configuration in an ancestor.
      # llm-baseline's pytest is not run here: its tests import transformers / accelerate without importorskip,
      # which the default sync does not install (the local procedure is in tools/llm-baseline/README.md).
      - name: Lint (workspace-external scripts)
        run: uv run --locked ruff check --config pyproject.toml ../llm-baseline
      - name: Format (workspace-external scripts)
        run: uv run --locked ruff format --check --config pyproject.toml ../llm-baseline
