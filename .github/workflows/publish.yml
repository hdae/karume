name: Publish

# Publish to JSR. Fires only when a GitHub Release is published (guards against accidental publishes).
# `deno publish` at the workspace root publishes the 3 packages (hub / runtime → models) in dependency
# order and skips idempotently when the version is already published. Authentication is OIDC, tokenless
# (no secret) — link the GitHub repository in each package's settings beforehand.
#
# Precondition: a Release is cut from a main commit with green CI (the test gate lives in ci.yml). deno publish
# itself also checks slow types etc. and does not publish when they fail.
#
# workflow_dispatch is the manual fallback for the first publish and for emergencies.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # the OIDC ID token authenticates with JSR.

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.6"
      - run: deno publish
