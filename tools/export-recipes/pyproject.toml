# Home of the per-model export recipes (ADR 0065 decision 2). **Not published to PyPI** — a virtual
# project that is not built into a wheel, holding the code derived from upstream models (patch /
# reference pipeline / dist recipe / card template) and its dependency groups outside core (PyPI
# karume). Dependencies go one way only, recipe → core
# (tools/exporter/tests/test_architecture_boundary.py).
[project]
name = "karume-export-recipes"
version = "0.0.0"
description = "Model-specific export recipes for the Karume exporter (repo-only, never published)"
requires-python = ">=3.12"
dependencies = ["karume"]
classifiers = ["Private :: Do Not Upload"]

[tool.uv]
package = false

[tool.uv.sources]
karume = { workspace = true }
# The torchvision of the dependency groups (anima / siglip2-preprocess) is pinned to the CPU index
# explicitly too — for the same reason as on the exporter side (an explicit index is used only for
# the packages pinned to it).
torchvision = { index = "pytorch-cpu" }

[dependency-groups]
dev = ["mypy>=1.15", "pytest>=9.1.1", "ruff>=0.15.0"]
# For the real-weight export of Anima (`uv sync --group anima`). Like sbv2, not in the default sync.
# What each entry is for (the hard dependencies of a plain export of the 4 components):
#   diffusers — AnimaTextConditioner / AutoencoderKLQwenImage were merged into the main package in
#     0.39 (CosmosTransformer3DModel has been there before).
#   torchvision — CosmosTransformer3DModel.forward calls `transforms.functional.resize` on the
#     concat_padding_mask path (the import is soft-guarded, but export always goes through it).
#   accelerate — required by diffusers' from_pretrained (low_cpu_mem_usage=True by default).
#   transformers — Qwen3Model of the text encoder. diffusers does not require transformers, so it
#     is declared explicitly.
# MUST: pin diffusers with `==` (the same reason as style-bert-vits2) — `anima.patch` replaces the
# forward of `QwenImageRMS_norm` / `QwenImageResample` / `QwenImageUpsample` /
# `QwenImageAttentionBlock` as class attributes, and holds wrappers that write out the forward of
# `AnimaTextConditioner` / `CosmosTransformer3DModel` verbatim. If a minor update changes the names
# of the replaced targets or the shape of a forward, the graph form (or the premise of eager
# equivalence) changes silently.
# MUST: pin transformers with `==` too (the same kind of reason as diffusers) — the Qwen3 wrapper of
# `anima.patch` relies on the implementation of `create_causal_mask` for the equivalence claim "for
# an all-ones mask of a single prompt, `causal & all_true == causal`", and `lift_rope_buffers`
# depends on Qwen3's RoPE buffer names (`inv_freq` / `original_inv_freq`). Both can change form
# silently in a minor update.
# torchvision / accelerate stay `>=` — they have no replaced targets, so there is no reason to fix
# an upper bound.
anima = [
  "accelerate>=1.0",
  "diffusers==0.39.0",
  "torchvision>=0.28",
  "transformers==5.14.1",
]
# For the real-weight export and references of Wan2.1 T2V (`uv sync --group wan`). Not in the
# default sync.
# What each entry is for (ADR 0118 decisions 4 / 7):
#   diffusers — `WanTransformer3DModel` / `AutoencoderKLWan` / `WanPipeline` /
#     `UniPCMultistepScheduler` (the source of truth of the reference pipeline).
#   ftfy — `pipeline_wan.prompt_clean` applies `ftfy.fix_text` only when ftfy is installed.
#     It is always installed so that the embeddings do not depend on whether it is (decision 4).
#   accelerate — required by diffusers' from_pretrained (low_cpu_mem_usage=True by default).
#   transformers — `wan.text_embeds` reads umT5 (`UMT5EncoderModel`) and the tokenizer in bf16 to
#     build the text embeddings (`pipeline_wan.py` also imports both at module level).
#   huggingface-hub — `wan.sources` fetches the pinned revision (it also arrives as a dependency
#     of diffusers, but what is imported directly is declared).
# MUST: pin diffusers with `==` (the same version as the anima group) — the 1e-6 correction of σ[0]
# in decision 5 and the RoPE table of decision 3 (float64 in the absence of MPS) depend on this
# version's implementation. A minor update can change the reference numbers silently.
# MUST: pin ftfy with `==` too — the text embeddings are built from the string after `fix_text`
# normalization, so if the normalization rules change between versions the same prompt becomes
# another embedding (the "fixed" of decision 4).
# When changing the versions of diffusers / ftfy / transformers, also update the fixed values of
# the distribution check (`wan.distribution.WAN_TEXT_EMBEDS_VERSIONS` — matched against the
# versions in the asset metadata) (`wan/tests/test_distribution.py` checks both).
# Pin transformers with `==` too — the values of the text embeddings are decided by transformers'
# UMT5 implementation (a version change can turn the same prompt into another embedding). The
# version is the same as in the other groups (versions are not split between groups that share one
# venv).
# accelerate / huggingface-hub have no replaced targets, so they stay `>=`.
# MUST: pin pillow with `==` too — the LANCZOS of the I2V conditioning image
# (`wan.i2v_preprocess_ref` / `wan.lanczos_fixture` / `wan.export_vae_encoder`) takes the values of
# Pillow's `Resample.c` as the source of truth, and the rgb8 of the git-tracked fixture and golden
# are decided by the version (the TS copy is matched to the same version too). It also arrives as a
# dependency of torchvision, but what is imported directly is declared (if that side dropped it or
# moved its version, things would change silently). When changing the version, regenerate the
# fixture and the golden (`wan/tests/test_lanczos_fixture.py` matches them against the current
# Pillow).
wan = [
  "accelerate>=1.0",
  "diffusers==0.39.0",
  "ftfy==6.3.1",
  "huggingface-hub>=1.26.0",
  "pillow==12.3.0",
  "transformers==5.14.1",
]
# MOSS-Image (OpenMOSS-Team/MOSS-Image-SFT) export and reference scripts (`uv sync --group moss`).
# Not part of the default sync. What each entry is for:
#   diffusers — the upstream `pipeline_moss_image.py` (pinned by revision and sha256 in
#     `moss.sources`) builds on `DiffusionPipeline`, `FlowMatchEulerDiscreteScheduler` and
#     `AutoencoderKLFlux2`; the references run that code as it is.
#   transformers — `moss.text_embeds` reads the Qwen3.5 text encoder and its tokenizer in bf16 and
#     calls upstream `encode_prompt`, which renders the chat template.
#   accelerate — diffusers' from_pretrained needs it (low_cpu_mem_usage=True by default).
#   huggingface-hub — `moss.sources` fetches the pinned revision (it also arrives as a dependency of
#     diffusers, but what is imported directly is declared).
# MUST: diffusers and transformers are pinned with `==` at the versions the other groups use (one
# venv holds all groups; a second pin would split it). The references are values of these versions'
# code (the scheduler's `set_timesteps`, the VAE, the Qwen3.5 implementation and its chat template
# rendering); a minor update can move them silently. Changing a version means regenerating the
# stage-0 records (`moss.reference`, `moss.host_fixture`, `moss.vae_reference`, `moss.text_embeds`).
moss = [
  "accelerate>=1.0",
  "diffusers==0.39.0",
  "huggingface-hub>=1.26.0",
  "transformers==5.14.1",
]
# For the real-weight export of SBV2 (`uv sync --group sbv2`). Not in the default sync — keeps the
# state where the tiny goldens and pytest run on the base deps alone.
# MUST: pin style-bert-vits2 with `==` — the SBV2 exporter is planned to monkeypatch package
# internals (class attributes of the modeling code) in a later iteration, and if a minor update
# changes the names of the replaced targets or the shape of a forward, the whole graph form changes
# silently. dp (iteration 1) itself passes unmodified, but loosening the pin delays the symptom into
# the form "dp passes, only the later iterations break".
# NOTE: the DeBERTa recipe (the `text_encoder` role of the SBV2 distribution) has no group of its
# own — the script needs only transformers, which arrives as a dependency of style-bert-vits2.
sbv2 = ["style-bert-vits2==2.5.0", "huggingface-hub>=1.26.0"]
# For the real-weight export of the SigLIP2 vision tower (`uv sync --group siglip2`). Not in the
# default sync.
# MUST: pin transformers with `==` (the same kind of reason as the anima group) — `siglip2.patch`
# replaces the forward of `SiglipVisionEmbeddings` / `SiglipMultiheadAttentionPoolingHead` as class
# attributes, and splits the MAP head's `nn.MultiheadAttention` into explicit q/k/v linears.
# If a minor update changes the names of the replaced targets or the shape of a forward, the graph
# form (or the premise of eager equivalence) changes silently.
# torchvision / pillow are not installed — image preprocessing is not part of the graph, so the
# vision tower export needs neither at all (measured: a run without both gives identical results).
siglip2 = ["transformers==5.14.1"]
# For generating the image preprocessing parity fixtures (`uv sync --group siglip2-preprocess`).
# The source of truth of `siglip2/preprocess.py` is the fast side `AutoImageProcessor` returns by
# default (`TorchvisionBackend`), so torchvision and pillow, which export does not need, are needed
# here (pillow is what `PILImageResampling` is — without it the resample mapping is empty and does
# not resolve to the fast side). Not added to the siglip2 group, to keep the export side's
# dependencies minimal.
# `siglip2/export.py --real-images` (real-image goldens) also runs with this group — real-image
# preprocessing must go through the same source of truth, and pillow is needed to open the PNGs.
siglip2-preprocess = ["pillow>=11", "torchvision>=0.28", "transformers==5.14.1"]
# For the real-weight export of BiRefNet_HR (`uv sync --group birefnet`). Not in the default sync.
# What each entry is for (what the bundled `birefnet.py` requires **at import time** — confirmed by
# measurement):
#   timm — Swin / PVTv2's `DropPath` / `to_2tuple` / `trunc_normal_`.
#   einops — the Decoder's `image2patches` (`rearrange`).
#   kornia — `from kornia.filters import laplacian` (only the training path's out_ref uses it, but
#     the import is at the top of the module, so inference export goes through it too).
#   transformers — `PretrainedConfig` / `PreTrainedModel`, and the dynamic module mechanism of
#     `trust_remote_code=True` that loads the bundled code.
#   pillow — `birefnet/export.py --real-images` opens real-image PNGs (the bundled `handler.py`'s
#     `ImagePreprocessor` is a PIL path, so the preprocessing source of truth goes through PIL as
#     a whole). It also arrives as a dependency of torchvision, but **what is imported directly is
#     declared** (if that side dropped it, it would go missing silently).
# torchvision (`torchvision.ops.deform_conv2d`) is in core's base dependencies, so it is not listed
# here.
# MUST: pin transformers with `==` (the same kind of reason as the anima / siglip2 groups) —
# `birefnet.patch` replaces class attributes of the dynamic module loaded by `trust_remote_code`, so
# if the dynamic module's resolution rules (cache location, how relative imports are wired) change,
# it loses track of the replaced targets. timm / einops / kornia have no replaced targets, so they
# stay `>=`.
# MUST: pin pillow with `==` too (the same version as the wan group — versions are not split between
# groups that share one venv). The golden of the alpha matte post-processing
# (`birefnet.matte_fixture` — HR's upstream procedure is Pillow's 8-bit bicubic) takes the values of
# `Resample.c` as the source of truth, and the git-tracked fixture is decided by the version (the TS
# copy is matched to the same version too). When changing the version, regenerate the fixture
# (`birefnet/tests/test_matte_fixture.py` matches it against the current Pillow).
birefnet = ["einops>=0.8", "kornia>=0.8", "pillow==12.3.0", "timm>=1.0", "transformers==5.14.1"]
# For the real-weight export of Depth Anything V2 (relative depth estimation from a single image)
# (`uv sync --group depth-anything`). Not in the default sync.
# What it needs and why: the target is the transformers port
# (`depth-anything/Depth-Anything-V2-Small-hf` — `DepthAnythingForDepthEstimation` +
# `Dinov2Backbone`), so only transformers is needed.
#   timm is not needed (`use_pretrained_backbone=false` makes the backbone a transformers
#   implementation too, and preprocessing is not part of the graph). pillow is not installed either
#   (the synthetic-image goldens do not open PNGs).
# MUST: pin transformers with `==` (the same kind of reason as the anima / siglip2 / birefnet
# groups) — `depth_anything.patch` replaces `DepthAnythingFeatureFusionStage.forward` and
# `Dinov2Embeddings.interpolate_pos_encoding` as class attributes and replaces `nn.ConvTranspose2d`
# per instance. If a minor update changes the names of the replaced targets or the shape of a
# forward, the graph form (or the premise of eager equivalence) changes silently.
depth-anything = ["transformers==5.14.1"]
# For `depth_anything/export.py --real-images` (real-image goldens) (`uv sync --group
# depth-anything-preprocess`). Split the same way as siglip2 / siglip2-preprocess, and not added to
# the depth-anything group, to keep the export side's dependencies minimal.
# Only pillow, to open the PNGs, is added — the torchvision required by the preprocessing source of
# truth `DPTImageProcessor` (fast side) is already in core's base dependencies (for registering the
# `deform_conv2d` op).
depth-anything-preprocess = ["pillow>=11", "transformers==5.14.1"]
# For the real-weight export of Gemma 4 mobile QAT (`uv sync --group gemma4-qat`). Not in the
# default sync. Only transformers is needed (the fixed-integer container `gemma_quant` is in the
# main package).
# MUST: pin transformers with `==` (the same kind of reason as the anima / siglip2 / birefnet
# groups) — the recipe depends directly on the attribute names (`weight_scale` /
# `input_activation_scale` / `embedding_quantized`) and the forward of `QuantizedLinear` /
# `QuantizedEmbedding` in `transformers.integrations.gemma_quant`, and if a minor update changes the
# spellings or the form of the rounding, the copies of the fixed values silently become something
# else.
gemma4-qat = ["transformers==5.14.1"]
# NOTE: the EmbeddingGemma / MiniCPM5 / vowel detector recipes have no dependency group — the
# former two add it temporarily with
# `uv run --with 'transformers==5.14.1' python -m <family>.export` (each script's docstring),
# and the vowel detector runs on core's base dependencies alone (torch / numpy / safetensors).

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["."]

# mypy is not in CI (manual `uv run mypy` only). Its targets are explicitly narrowed to "our own
# logic of the numeric measurement reports" — widening it to every recipe would make the missing
# types of torch / diffusers and the like the main subject and dilute the point of the check (the
# consistency of our own code). The commit body is the ledger of the count and breakdown of the
# remaining findings (made permanent by the ruling on B15 of the 2026-08-16 review).
[tool.mypy]
python_version = "3.12"
files = ["anima/measure_report.py", "anima/measure_quant.py", "anima/pipeline_ref.py"]
ignore_missing_imports = true

# The same settings as core (tools/exporter/pyproject.toml) — scripts move back and forth with
# core, so a different formatting rule on one side would produce unrelated diffs at every move.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# RUF001-003: the prose is Japanese, so full-width punctuation would be reported on every line as
# "ambiguous with ASCII" (as the prose conventions intend).
ignore = ["RUF001", "RUF002", "RUF003"]

# `karume` is the core package of the same workspace — mixing it into the same block as plain
# dependencies would make "what is borrowed from core" unreadable from the import order (on the
# core side this happens naturally through src detection).
[tool.ruff.lint.isort]
known-first-party = ["karume"]
