# モデル別 export recipe の置き場（ADR 0065 決定 2）。**PyPI へは公開しない** — wheel に
# しない仮想プロジェクトで、上流モデル由来コード（patch / 参照 pipeline / dist recipe /
# card template）とその依存グループを core（PyPI karume）の外で管理する。
# 依存方向は recipe → core の一方向のみ（tools/exporter/tests/test_architecture_boundary.py）。
[project]
name = "karume-export-recipes"
version = "0.0.0"
description = "Model-specific export recipes for the Karume exporter (repo-only, never published)"
requires-python = ">=3.12"
dependencies = ["karume"]
classifiers = ["Private :: Do Not Upload"]

[tool.uv]
package = false

[tool.uv.sources]
karume = { workspace = true }
# 依存グループ（anima / siglip2-preprocess）の torchvision も CPU index へ明示ピン —
# exporter 側と同じ理由（explicit な index はピンした対象にしか使われない）。
torchvision = { index = "pytorch-cpu" }

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.15.0"]
# Anima の実重み export 用（`uv sync --group anima`）。sbv2 と同じく既定の sync には入れない。
# 内訳と根拠（4 コンポーネントの素の export に必要なハード依存）:
#   diffusers — AnimaTextConditioner / AutoencoderKLQwenImage が本体にマージされたのが 0.39
#     （CosmosTransformer3DModel は以前からある）。
#   torchvision — CosmosTransformer3DModel.forward が concat_padding_mask 経路で
#     `transforms.functional.resize` を呼ぶ（import は soft ガードだが export 時に必ず通る）。
#   accelerate — diffusers の from_pretrained は既定 low_cpu_mem_usage=True で必須。
#   transformers — text encoder の Qwen3Model。diffusers は transformers を要求しないので明示。
# MUST: diffusers は `==` でピンする（style-bert-vits2 と同じ理由）— `anima.patch` が
# `QwenImageRMS_norm` / `QwenImageResample` / `QwenImageUpsample` / `QwenImageAttentionBlock` の
# forward をクラス属性ごと差し替え、`AnimaTextConditioner` / `CosmosTransformer3DModel` の
# forward を逐語で書き下したラッパを持つ。マイナー更新で差し替え先の名前や forward の形が
# 変わると、グラフ形（や eager 同値の前提）が黙って変わる。
# MUST: transformers も `==` でピンする（diffusers と同型の理由）— `anima.patch` の Qwen3
# ラッパは「単一プロンプトの全 1 マスクなら `causal & all_true == causal`」という同値主張を
# `create_causal_mask` の実装に預けており、`lift_rope_buffers` は Qwen3 の RoPE バッファ名
# （`inv_freq` / `original_inv_freq`）に依存する。どちらもマイナー更新で黙って形が変わる。
# torchvision / accelerate は `>=` のまま — 差し替え対象を持たず、上限を固定する理由が無い。
anima = [
  "accelerate>=1.0",
  "diffusers==0.39.0",
  "torchvision>=0.28",
  "transformers==5.14.1",
]
# SBV2 の実重み export 用（`uv sync --group sbv2`）。既定の sync には入れない — base deps
# だけで tiny golden と pytest が回る状態を保つ。
# MUST: style-bert-vits2 は `==` でピンする — SBV2 のエクスポータは後続の波でパッケージ内部
# （モデリングコードのクラス属性）を monkeypatch する予定で、マイナー更新で差し替え先の
# 名前や forward の形が変わるとグラフ形ごと黙って変わる。dp（波 1）自体は無改造で通るが、
# ピンを緩めると「dp は通るのに後続の波だけ壊れる」形で表面化が遅れる。
# NOTE: DeBERTa recipe（SBV2 配布形の `text_encoder` 席）は独立した席を持たない — 台本が要る
# のは transformers だけで、それは style-bert-vits2 の依存として入る。
sbv2 = ["style-bert-vits2==2.5.0", "huggingface-hub>=1.26.0"]
# SigLIP2 vision tower の実重み export 用（`uv sync --group siglip2`）。既定の sync には
# 入れない。
# MUST: transformers は `==` でピンする（anima グループと同型の理由）— `siglip2.patch` が
# `SiglipVisionEmbeddings` / `SiglipMultiheadAttentionPoolingHead` の forward をクラス属性
# ごと差し替え、MAP head の `nn.MultiheadAttention` を q/k/v の明示 linear へ割り直す。
# マイナー更新で差し替え先の名前や forward の形が変わると、グラフ形（や eager 同値の前提）が
# 黙って変わる。
# torchvision / pillow は入れない — 画像の前処理はグラフに載せないので、vision tower の
# export には一切要らない（両方外した実行で同一結果を実測）。
siglip2 = ["transformers==5.14.1"]
# 画像前処理のパリティ用フィクスチャ生成用（`uv sync --group siglip2-preprocess`）。
# `siglip2/preprocess.py` の正本は `AutoImageProcessor` が既定で返す fast 側
# （`TorchvisionBackend`）なので、export には要らない torchvision と pillow がここでは要る
# （pillow は `PILImageResampling` の実体 — 無いと resample の対応表が空になり、fast 側へ
# 解決されない）。export 側の最小依存を保つため siglip2 グループには足さない。
# `siglip2/export.py --real-images`（実画像 golden）もこのグループで回す — 実画像の前処理は
# 同じ正本を通す必要があり、PNG を開く pillow も要る。
siglip2-preprocess = ["pillow>=11", "torchvision>=0.28", "transformers==5.14.1"]
# BiRefNet_HR の実重み export 用（`uv sync --group birefnet`）。既定の sync には入れない。
# 内訳と根拠（同梱 `birefnet.py` が **import 時**に要求するもの — 実測で確定）:
#   timm — Swin / PVTv2 の `DropPath` / `to_2tuple` / `trunc_normal_`。
#   einops — Decoder の `image2patches`（`rearrange`）。
#   kornia — `from kornia.filters import laplacian`（使うのは学習経路の out_ref だけだが、
#     import はモジュール先頭なので推論 export でも通る）。
#   transformers — `PretrainedConfig` / `PreTrainedModel` と、同梱コードを読む
#     `trust_remote_code=True` の動的モジュール機構。
#   pillow — `birefnet/export.py --real-images` が実画像 PNG を開く（同梱 `handler.py` の
#     `ImagePreprocessor` が PIL 経路なので、前処理の正本ごと PIL で通す）。torchvision の
#     依存としても入るが、**直接 import するものは宣言する**（あちらが落としたら黙って
#     欠ける）。
# torchvision（`torchvision.ops.deform_conv2d`）は core の基本依存にあるのでここには書かない。
# MUST: transformers は `==` でピンする（anima / siglip2 グループと同型の理由）—
# `birefnet.patch` は `trust_remote_code` が読み込んだ動的モジュールのクラス属性を差し替える
# ので、動的モジュールの解決規約（キャッシュ先・相対 import の張り方）が変わると差し替え先を
# 見失う。timm / einops / kornia は差し替え対象を持たないので `>=` のまま。
birefnet = ["einops>=0.8", "kornia>=0.8", "pillow>=11", "timm>=1.0", "transformers==5.14.1"]
# Depth Anything V2（単一画像の相対深度推定）の実重み export 用（`uv sync --group
# depth-anything`）。既定の sync には入れない。
# 内訳と根拠: 対象は transformers 移植版（`depth-anything/Depth-Anything-V2-Small-hf` —
# `DepthAnythingForDepthEstimation` + `Dinov2Backbone`）なので、要るのは transformers だけ。
#   timm は要らない（`use_pretrained_backbone=false` で backbone も transformers 実装・
#   前処理はグラフに載せない）。pillow も入れない（合成画像 golden は PNG を開かない）。
# MUST: transformers は `==` でピンする（anima / siglip2 / birefnet グループと同型の理由）—
# `depth_anything.patch` が `DepthAnythingReassembleLayer` / `DepthAnythingFeatureFusionLayer`
# の forward をクラス属性ごと差し替える。マイナー更新で差し替え先の名前や forward の形が
# 変わると、グラフ形（や eager 同値の前提）が黙って変わる。
depth-anything = ["transformers==5.14.1"]
# `depth_anything/export.py --real-images`（実画像 golden）用（`uv sync --group
# depth-anything-preprocess`）。siglip2 / siglip2-preprocess と同じ分け方で、export 側の
# 最小依存を保つために depth-anything グループへは足さない。
# 足すのは PNG を開く pillow だけ — 前処理の正本 `DPTImageProcessor`（fast 側）が要求する
# torchvision は既に core の基本依存にある（`deform_conv2d` の op 登録用）。
depth-anything-preprocess = ["pillow>=11", "transformers==5.14.1"]
# NOTE: EmbeddingGemma / 母音検出 recipe は依存グループを持たない — 前者は
# `uv run --with 'transformers==5.14.1' python -m embeddinggemma.export` の一時足し
# （台本の docstring）、後者は core の基本依存（torch / numpy / safetensors）だけで回る。

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["."]

# core（tools/exporter/pyproject.toml）と同じ設定 — 台本は core と行き来するので、
# 片方だけ別の整形規則にすると移動のたびに無関係な差分が出る。
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# RUF001-003: 散文は日本語なので全角約物が「ASCII と紛らわしい」で全行に出る（本文の規約どおり）。
ignore = ["RUF001", "RUF002", "RUF003"]

# `karume` は同じ workspace の core パッケージ — 素の依存と同じ塊に混ぜると「core から
# 何を借りているか」が import の並びから読めなくなる（core 側は src 検出で自然にこうなる）。
[tool.ruff.lint.isort]
known-first-party = ["karume"]
