# The virtual root of the uv workspace (ADR 0065 decision 4).
# exporter (PyPI karume = the generic core) and export-recipes (the repository-only per-model
# recipes) share one lock / venv — no second copy of the whole torch stack just for the recipes.
# Each member's pyproject declares its dependencies; this file only groups them.
[tool.uv.workspace]
members = ["exporter", "export-recipes"]

# The torch CPU index is declared at the root because it affects resolution across the members
# (the members' [tool.uv.sources] entries for torch / torchvision point at this index).
# MUST: keep `explicit = true` — without it this index shadows PyPI and the generic dependencies get
# pinned to the index's old stock (packaging 24.1 / requests 2.28 and the like) (observed
# 2026-08-16; the actual damage is that packaging>=24.2, which hatchling>=1.27 requires, cannot be
# resolved).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
