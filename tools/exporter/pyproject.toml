[project]
name = "karume"
version = "0.3.0"
description = "torch.export -> Karume IR v1 exporter"
requires-python = ">=3.12"
# SPDX 式（PEP 639）— 実測でメタデータは `License-Expression: MIT` + `License-File: LICENSE`。
# 同梱する `LICENSE` はリポジトリ直下の同文コピーで、`license-files` のリスト形明示は
# hatchling>=1.27 が要る（pytorch-cpu index の explicit 化で解決可能になった — 2026-08-16。
# それ以前は index が PyPI を影に隠し packaging>=24.2 が引けなかった）。
# この wheel が配るのは汎用 exporter core だけで、上流モデル実装のコピーは 1 本も入らない
# （ADR 0065 決定 7）— 上流由来コードの provenance は recipe 側が負う。
license = "MIT"
license-files = ["LICENSE"]
# numpy は safetensors.torch の save/load が内部で要求する（torch 経由では入らない）。
# torchvision は `torchvision::deform_conv2d`（DCNv2 = 第 1' 層 op・ADR 0055）の op 登録に
# 要る — ハンドラのキー（`torch.ops.torchvision.deform_conv2d.default`）と golden 生成の
# 両方が import を前提にするので、グループではなく基本依存に置く。
dependencies = ["numpy>=2.0", "safetensors>=0.8.0", "torch>=2.13.0", "torchvision>=0.28"]

[project.scripts]
karume = "karume.cli:main"

# torchvision も明示ピン MUST — index が explicit なので、ピンを忘れると PyPI 側の
# CUDA ビルドへ黙って化ける。
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.15.0"]

[build-system]
# >=1.27: PEP 639 の `license-files` リスト形の下限（上の NOTE）。
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/karume"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# RUF001-003: 散文は日本語なので全角約物が「ASCII と紛らわしい」で全行に出る（本文の規約どおり）。
ignore = ["RUF001", "RUF002", "RUF003"]
