[project]
name = "karume"
version = "0.21.0"
description = "torch.export -> Karume IR and container (krm) exporter"
requires-python = ">=3.12"
# SPDX expression (PEP 639) — observed metadata: `License-Expression: MIT` + `License-File: LICENSE`.
# The bundled `LICENSE` is an identical copy of the one at the repository root; the explicit list
# form of `license-files` needs hatchling>=1.27 (resolvable since the pytorch-cpu index was made
# explicit — 2026-08-16; before that the index shadowed PyPI and packaging>=24.2 could not be
# resolved).
# This wheel ships only the generic exporter core and not a single copy of an upstream model
# implementation (ADR 0065 decision 7) — the provenance of upstream-derived code is the recipes'
# responsibility.
license = "MIT"
license-files = ["LICENSE"]
# numpy is used directly by core — emit / convert take tensor bytes out through `Tensor.numpy()`
# (stored payloads, constant digests), and dist turns tables moved from `.npy` / ckpt into asset
# bytes with `safetensors.numpy` (`table_payload`). The safetensors.torch that goldens uses
# requires it internally as well (none of these come in through torch).
# torchvision is needed for the op registration of `torchvision::deform_conv2d` (DCNv2 = an
# extended atomic op, ADR 0055) — both the handler key
# (`torch.ops.torchvision.deform_conv2d.default`) and golden generation assume the import, so it
# is a base dependency, not a group.
dependencies = ["numpy>=2.0", "safetensors>=0.8.0", "torch>=2.13.0", "torchvision>=0.28"]

[project.scripts]
karume = "karume.cli:main"

# torchvision MUST be pinned explicitly as well — the index is explicit, so a forgotten pin
# silently turns into the CUDA build from PyPI.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.15.0"]

[build-system]
# >=1.27: the minimum for the PEP 639 list form of `license-files` (the note above).
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/karume"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# RUF001-003: the English prose uses typographic characters (× — − ′ …) that these rules flag as
# "ambiguous with ASCII" (281 hits on 2026-10-19); they are the project's spelling, not mistakes.
ignore = ["RUF001", "RUF002", "RUF003"]
