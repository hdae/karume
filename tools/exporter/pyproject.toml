[project]
name = "karume"
version = "0.2.2"
description = "torch.export -> Karume IR v1 exporter"
requires-python = ">=3.12"
# SPDX 式（PEP 639）— 実測でメタデータは `License-Expression: MIT`。同梱する `LICENSE` は
# リポジトリ直下の同文コピーで、hatchling 既定の license-files グロブが拾って wheel の
# `.dist-info/licenses/LICENSE` に入る（実測）。
# NOTE: PEP 639 の `license-files = [...]`（リスト形）を明示するには hatchling>=1.27 が要るが、
# pytorch-cpu index が先に並ぶ現構成では `packaging>=24.2` が引けず解決できない（実測）。
# 明示しなくても既定グロブで同じ結果になるので、index 構成を触るまでは既定に任せる。
# この wheel が配るのは汎用 exporter core だけで、上流モデル実装のコピーは 1 本も入らない
# （ADR 0065 決定 7）— 上流由来コードの provenance は recipe 側が負う。
license = "MIT"
# numpy は safetensors.torch の save/load が内部で要求する（torch 経由では入らない）。
# torchvision は `torchvision::deform_conv2d`（DCNv2 = 第 1' 層 op・ADR 0055）の op 登録に
# 要る — ハンドラのキー（`torch.ops.torchvision.deform_conv2d.default`）と golden 生成の
# 両方が import を前提にするので、グループではなく基本依存に置く。
dependencies = ["numpy>=2.0", "safetensors>=0.8.0", "torch>=2.13.0", "torchvision>=0.28"]

[project.scripts]
karume = "karume.cli:main"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.15.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/karume"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# RUF001-003: 散文は日本語なので全角約物が「ASCII と紛らわしい」で全行に出る（本文の規約どおり）。
ignore = ["RUF001", "RUF002", "RUF003"]
