<!DOCTYPE html>
<html lang="en">
  <meta charset="utf-8">
  <title>Benchmark runner</title>
  <script type="importmap">
  {
    "imports": {
      "onnxruntime-web/webgpu": "/vendor/ort.webgpu.min.mjs?v={{onnxruntime}}",
      "onnxruntime-common": "/vendor/ort.webgpu.min.mjs?v={{onnxruntime}}"
    }
  }
  </script>
  <script type="module">
  import { runBenchmark } from "/runner.js";
  const params = new URLSearchParams(location.search);
  const engine = params.get("engine"), model = params.get("model");
  const reduce = params.get("reduce") ?? "quant";
  const prefill = params.get("prefill") ?? "default";
  const send = (type, value) => parent.postMessage({ type, value }, location.origin);
  try {
    if (!["karume", "transformers"].includes(engine) || !["normal", "qat"].includes(model)) {
      throw Error("Invalid benchmark selection");
    }
    if (!["quant", "sequential", "parallel"].includes(reduce)) throw Error("Invalid GEMV reduction");
    if (!["default", "sparse", "dense"].includes(prefill)) throw Error("Invalid prefill buckets");
    const config = await (await fetch("/config.json")).json();
    const result = await runBenchmark(
      engine,
      model,
      config.localOnnx,
      (s) => send("status", s),
      reduce === "quant" ? undefined : reduce,
      prefill,
    );
    send("result", {
      ...result,
      checkout: config.revision,
      checkoutDirty: config.dirty,
      bundleSha256: config.bundleSha256,
    });
  } catch (error) {
    send("error", String(error?.stack ?? error));
  }
  </script>
</html>
